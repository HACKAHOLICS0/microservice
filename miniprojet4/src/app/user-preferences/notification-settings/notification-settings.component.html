<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Notifications</h5>
          <div>
            <button type="button" class="btn btn-sm btn-light me-2" (click)="markAllAsRead()" [disabled]="loading || notifications.length === 0">
              <i class="bi bi-check-all"></i> Tout marquer comme lu
            </button>
            <button type="button" class="btn btn-sm btn-danger" (click)="deleteAllNotifications()" [disabled]="loading || notifications.length === 0">
              <i class="bi bi-trash"></i> Tout supprimer
            </button>
          </div>
        </div>
        <div class="card-body">
          <div class="mb-3 d-flex justify-content-between align-items-center">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="unreadOnly" [(ngModel)]="unreadOnly" (change)="toggleUnreadOnly()">
              <label class="form-check-label" for="unreadOnly">Afficher uniquement les non lues</label>
            </div>
            <div *ngIf="totalPages > 1" class="pagination-controls">
              <button type="button" class="btn btn-sm btn-outline-primary me-1" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
                <i class="bi bi-chevron-left"></i>
              </button>
              <span>Page {{currentPage}} / {{totalPages}}</span>
              <button type="button" class="btn btn-sm btn-outline-primary ms-1" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>
          </div>

          <div *ngIf="error" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ error }}
            <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="loadNotifications()">
              <i class="bi bi-arrow-clockwise"></i> Réessayer
            </button>
          </div>

          <div *ngIf="loading" class="d-flex justify-content-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Chargement...</span>
            </div>
          </div>

          <div *ngIf="!loading && notifications.length === 0" class="alert alert-info">
            Aucune notification à afficher.
          </div>

          <div *ngIf="!loading && notifications.length > 0" class="notification-list">
            <div *ngFor="let notification of notifications" class="card mb-2" [ngClass]="{'bg-light': !notification.isRead}">
              <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-start">
                  <div class="d-flex align-items-center">
                    <div class="notification-icon me-3">
                      <i class="bi" [ngClass]="'bi-' + getNotificationIcon(notification.type)"></i>
                    </div>
                    <div>
                      <h6 class="mb-1">{{ notification.title }}</h6>
                      <p class="mb-1">{{ notification.message }}</p>
                      <small class="text-muted">{{ getFormattedDate(notification.createdAt) }}</small>
                    </div>
                  </div>
                  <div class="notification-actions">
                    <button type="button" *ngIf="!notification.isRead" class="btn btn-sm btn-outline-primary me-2" (click)="markAsRead(notification)" title="Marquer comme lu">
                      <i class="bi bi-check"></i> Lu
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteNotification(notification)" title="Supprimer">
                      <i class="bi bi-trash"></i> Supprimer
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
