<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar">
   <!-- Sidebar - Brand -->
  <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html "routerLink="/users/dahsboard">

    <div  class="sidebar-brand-text mx-3 " style="font-weight: bold;"><img src="assets/img/shop.png"/> &nbsp;M<sup>4</sup>E&nbsp;<sub style="font-weight: lighter;" >shop</sub></div>

  </a>
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item">
          <a class="nav-link" routerLink="/users/dahsboard">
            <i class="fas fa-sticky-note"></i>
            <span>Users</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/factures/facture">
            <i class="fas fa-sticky-note"></i>
            <span>Factures</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/CodePromo/codepromo">
            <i class="fas fa-barcode"></i>
            <span>Codes promo</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products/categorieProduit">
            <i class="fab fa-product-hunt"></i>
            <span>Categories produits</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products/produit">
            <i class="fab fa-product-hunt"></i>
            <span>Produits</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/reclamations/reclamation">
            <i class="far fa-envelope"></i>
            <span>Reclamations</span></a>
        </li>
      
      </ul>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="search-box">
        <!-- <input type="text" placeholder="Rechercher un utilisateur..." [(ngModel)]="searchTerm" (input)="onSearch()"> -->
      </div>
      <div class="user-menu">
        <button class="logout-btn" (click)="logout()">Déconnexion</button>
      </div>
    </div>

    <!-- Users Section -->
    <div class="users-section">
      

      <!-- Users Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th (click)="toggleSort()" class="sortable">
                ID
                <span class="sort-icon" [class.asc]="sortDirection === 'asc'" [class.desc]="sortDirection === 'desc'">
                  {{ sortDirection === 'asc' ? '↑' : '↓' }}
                </span>
              </th>
              <th>Prénom</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Rôle</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers">
              <td>{{ user.id }}</td>
              <td>{{ user.firstName }}</td>
              <td>{{ user.lastName }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span class="badge" [class.badge-admin]="user.role === 'ADMIN'" [class.badge-user]="user.role === 'USER'">
                  {{ user.role }}
                </span>
              </td>
              <td>
                <button class="btn-delete" (click)="deleteUser(user.id)">Supprimer</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
