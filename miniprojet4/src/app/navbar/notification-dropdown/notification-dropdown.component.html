<div class="notification-dropdown">
  <button type="button" class="btn btn-link position-relative" (click)="toggleDropdown()" title="Notifications">
    <i class="bi bi-bell-fill"></i>
    <span *ngIf="unreadCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
      {{ unreadCount > 9 ? '9+' : unreadCount }}
      <span class="visually-hidden">notifications non lues</span>
    </span>
  </button>

  <div class="dropdown-menu notification-menu" [ngClass]="{'show': isOpen}">
    <div class="dropdown-header d-flex justify-content-between align-items-center">
      <h6 class="mb-0">Notifications</h6>
      <button type="button" class="btn btn-sm btn-primary" (click)="markAllAsRead($event)" *ngIf="unreadCount > 0">
        <i class="bi bi-check-all me-1"></i> Tout marquer comme lu
      </button>
    </div>

    <div class="dropdown-divider"></div>

    <div *ngIf="loading" class="text-center p-2">
      <div class="spinner-border spinner-border-sm text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
    </div>

    <div *ngIf="error" class="text-center p-2">
      <p class="text-danger mb-0"><i class="bi bi-exclamation-circle me-1"></i> {{ error }}</p>
      <button type="button" class="btn btn-sm btn-link" (click)="loadNotifications()">
        <i class="bi bi-arrow-clockwise"></i> Réessayer
      </button>
    </div>

    <div *ngIf="!loading && !error && notifications.length === 0" class="text-center p-3">
      <p class="text-muted mb-0">Aucune notification</p>
    </div>

    <div *ngIf="!loading && !error && notifications.length > 0" class="notification-list">
      <a *ngFor="let notification of notifications"
         class="dropdown-item notification-item"
         [ngClass]="{'unread': !notification.isRead}"
         (click)="markAsRead(notification, $event)">
        <div class="d-flex align-items-center">
          <div class="notification-icon me-2">
            <i class="bi" [ngClass]="getNotificationIcon(notification.type)"></i>
          </div>
          <div class="notification-content">
            <div class="notification-title">{{ notification.title }}</div>
            <div class="notification-text">{{ notification.message }}</div>
            <div class="notification-time">{{ getFormattedDate(notification.createdAt) }}</div>
          </div>
        </div>
      </a>
    </div>

    <div class="dropdown-divider"></div>

    <div class="dropdown-footer">
      <a class="dropdown-item text-center fw-bold" (click)="viewAllNotifications()">
        <i class="bi bi-list me-1"></i> Voir toutes les notifications
      </a>
    </div>
  </div>
</div>
